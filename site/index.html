<title>bon stage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,900,100,1&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout: one butter-yellow "digest" sheet inside a rust frame; role tabs on top,
   filter pills, then cards. Single deliberate light look (retro 70s reference). */
:root{
  color-scheme: light;
  --rust:#7b2d1a;
  --cream:#f6efe2;
  --paper:#fbf7ee;
  --tomato:#e04e24;
  --tomato-soft:#f6c7b4;
  --sky:#c3d7ec;
  --sky-ink:#2f5d8a;
  --butter:#f3de85;
  --mint:#c7e6da;
  --mint-ink:#2c6b55;
  --ink:#2a1a14;
  --ink-soft:#6b5348;
  --line:#e2d6c3;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --logo:"Fraunces", Georgia, serif;
  --hand:"Caveat", "Comic Sans MS", cursive;
}
*{box-sizing:border-box}
body{background:var(--rust);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky-ink);outline-offset:2px}

.frame{max-width:1180px;margin:0 auto;padding-block:16px 32px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* top bar */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;color:var(--cream);padding:4px 4px 16px}
.logo{font-family:var(--logo);font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1;color:var(--butter);font-size:clamp(34px,5vw,48px);line-height:.85;letter-spacing:-.02em;margin:0}
.logo small{display:block;font-family:var(--hand);font-weight:500;font-size:20px;letter-spacing:0;color:var(--cream);margin-top:6px;font-variation-settings:normal}
.status{font-size:12px;letter-spacing:.04em;text-align:right;opacity:.92}
.status b{font-weight:700}

/* digest sheet */
.sheet{background:var(--butter);border-radius:36px;padding:28px 22px 36px}
.summary{display:flex;align-items:center;justify-content:center;gap:10px 14px;flex-wrap:wrap;margin:0 auto 18px;text-align:center}
.summary h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.4vw,38px);line-height:1.05;margin:0;text-wrap:balance}
.summary .chip-label{background:var(--sky);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px}

/* role tabs */
.tabs-wrap{overflow-x:auto;margin:0 -6px 18px;padding:0 6px 4px;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:8px;justify-content:center;min-width:max-content;margin:0 auto}
.tab{border:0;background:var(--paper);border-radius:999px;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;transition:transform .15s}
.tab:hover{transform:translateY(-1px)}
.tab .n{font-size:11px;background:var(--cream);border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--tomato);color:#fff}
.tab[aria-selected="true"] .n{background:rgba(255,255,255,.25)}
.tab.tracker{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.tab.tracker[aria-selected="true"]{background:var(--ink);color:var(--butter);box-shadow:none}
.role-blurb{text-align:center;font-family:var(--hand);font-size:22px;color:var(--rust);margin:-6px 0 14px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;margin:0 auto 24px;max-width:960px}
.fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fgroup > span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-right:2px}
.pill{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;line-height:1.2}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--butter)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:1080px;margin:0 auto}
.card{background:var(--paper);border-radius:22px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:9px;position:relative;min-width:0}
.card.dim{opacity:.55}
.card .ico{width:54px;height:54px;margin:0 auto 2px}
.card .kicker{text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.card h3{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.05;text-align:center;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.card .company{text-align:center;font-size:13px;color:var(--ink-soft)}
.card .new{position:absolute;top:12px;right:16px;font-family:var(--hand);font-size:21px;color:var(--tomato);transform:rotate(8deg)}
.card .example{position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--cream);border:1px dashed var(--ink-soft);border-radius:99px;padding:1px 7px;color:var(--ink-soft)}
.flags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.flag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--cream);border:1px solid var(--line)}
.flag.en{background:var(--mint);border-color:transparent;color:var(--mint-ink)}
.flag.fr{background:var(--tomato-soft);border-color:transparent;color:var(--rust)}
.flag.bonus{background:var(--sky);border-color:transparent;color:var(--sky-ink)}
.match{display:flex;align-items:center;gap:10px;font-size:12px}
.match .bar{flex:1;height:8px;border-radius:99px;background:var(--cream);overflow:hidden;border:1px solid var(--line)}
.match .bar i{display:block;height:100%;background:var(--tomato);border-radius:99px}
.match b{min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums}
.match.none{color:var(--ink-soft);justify-content:center;font-style:italic}
details.fit{font-size:13px;border-top:1px dashed var(--line);padding-top:8px}
details.fit summary{cursor:pointer;font-weight:500}
details.fit h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:8px 0 2px;color:var(--ink-soft);font-weight:500}
details.fit ul{margin:0;padding-left:18px}
details.fit .plus li::marker{content:"+  ";color:var(--mint-ink);font-weight:700}
details.fit .minus li::marker{content:"–  ";color:var(--tomato);font-weight:700}
.card .actions{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;padding-top:8px;flex-wrap:wrap}
.btn{display:inline-block;background:var(--tomato);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.status-select{appearance:none;-webkit-appearance:none;border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:7px 28px 7px 12px;font-size:12px;font-weight:500;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.status-select[data-s="saved"]{background-color:var(--sky)}
.status-select[data-s="applied"]{background-color:var(--butter)}
.status-select[data-s="interview"]{background-color:var(--mint)}
.status-select[data-s="offer"]{background-color:var(--mint);border-color:var(--mint-ink)}
.status-select[data-s="rejected"],.status-select[data-s="skip"]{background-color:var(--cream);color:var(--ink-soft)}
.card .src{text-align:center;font-size:11px;color:var(--ink-soft)}
.empty{grid-column:1/-1;text-align:center;padding:36px 16px}
.empty p{font-family:var(--hand);font-size:26px;margin:0 0 4px}
.empty small{color:var(--ink-soft)}
.show-hidden{display:block;margin:20px auto 0;background:none;border:0;text-decoration:underline;font-size:12px;color:var(--ink-soft);cursor:pointer}

/* tracker view */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:1080px;margin:0 auto}
.col{background:var(--paper);border-radius:20px;padding:16px;min-width:0}
.col h3{margin:0 0 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}
.col h3 span{font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.trow{border-top:1px dashed var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.trow b{font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.1}
.trow .meta{font-size:12px;color:var(--ink-soft)}
.trow input{width:100%;border:1px solid var(--line);background:var(--cream);border-radius:10px;padding:6px 9px;font-size:12px}
.trow .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.trow a{font-size:12px}
.col .none{font-size:12px;color:var(--ink-soft);font-style:italic}

/* manual search */
.manual{margin:22px auto 0;max-width:1080px;color:var(--cream)}
.manual summary{cursor:pointer;font-size:13px;letter-spacing:.04em;text-align:center;list-style:none}
.manual summary::-webkit-details-marker{display:none}
.manual summary::before{content:"✱ ";color:var(--butter)}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.mbox{border:1.5px solid var(--cream);border-radius:18px;padding:14px}
.mbox h4{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.mbox a{display:inline-block;margin:0 6px 8px 0;font-size:12px;text-decoration:none;padding:5px 11px;border-radius:999px;border:1px solid rgba(246,239,226,.5)}
.mbox a:hover{background:var(--cream);color:var(--rust)}
.mnote{font-size:12px;opacity:.8;text-align:center;margin:10px 0 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--butter);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media (max-width:920px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .sheet{border-radius:26px;padding:22px 12px 28px}
  .cards,.board,.mgrid{grid-template-columns:1fr}
  .tabs{justify-content:flex-start}
  .status{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="frame">
  <header class="top">
    <p class="logo">bon stage<small>internships with a point</small></p>
    <div class="status" id="status">loading…</div>
  </header>

  <main class="sheet">
    <div class="summary">
      <span class="chip-label">since last update</span>
      <h1 id="headline">Your internship digest</h1>
    </div>

    <div class="tabs-wrap"><div class="tabs" id="tabs" role="tablist" aria-label="Roles"></div></div>
    <p class="role-blurb" id="blurb"></p>

    <div id="digestView">
      <div class="filters" id="filters"></div>
      <div class="cards" id="cards"></div>
      <button class="show-hidden" id="showHidden" hidden></button>
    </div>
    <div id="trackerView" hidden>
      <div class="board" id="board"></div>
    </div>
  </main>

  <details class="manual" id="manual">
    <summary>Search LinkedIn & Indeed yourself</summary>
    <div class="mgrid" id="mgrid"></div>
    <p class="mnote">These sites don't allow automatic collection, so these are ready-made searches with the right filters.</p>
  </details>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
/* ---------- constants ---------- */
const STATUSES = [
  ["", "Not tracked"], ["saved","Saved"], ["applied","Applied"], ["interview","Interview"],
  ["offer","Offer"], ["rejected","Rejected"], ["skip","Not for me"]
];
const BOARD_COLS = [["saved","Saved"],["applied","Applied"],["interview","Interview"],["offer","Offer"]];
const FILTERS = [
  { key:"place", label:"Where", opts:[["all","All"],["lyon","Lyon"],["france","France"],["abroad","Other countries"]] },
  { key:"type", label:"Type", opts:[["all","All"],["intern","Internship"],["junior","Junior"]] },
  { key:"start", label:"Start", opts:[["all","Any"],["summer27","Summer 27"],["autumn27","Autumn 27"]] },
  { key:"extra", label:"Only", opts:[["all","All"],["new","New"],["nofr","No French needed"]] }
];
const ICONS = {
  spark:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 34c6-18 22-26 40-22 8 2 10 12 4 20-7 10-26 18-38 14-6-2-8-6-6-12z" fill="#e04e24"/><path d="M32 18l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#fbf7ee"/></svg>`,
  lens:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 30c2-14 18-22 32-18 12 4 16 16 10 26-6 10-22 16-34 10-6-4-9-10-8-18z" fill="#c3d7ec"/><circle cx="29" cy="29" r="9" fill="none" stroke="#2f5d8a" stroke-width="4"/><path d="M36 36l9 9" stroke="#2f5d8a" stroke-width="4" stroke-linecap="round"/></svg>`,
  cap:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 32c4-16 22-24 38-18 12 4 16 18 8 28-8 9-26 14-38 8-6-4-9-10-8-18z" fill="#c7e6da"/><path d="M14 28l18-9 18 9-18 9z" fill="#2c6b55"/><path d="M22 32v8c6 4 14 4 20 0v-8" fill="none" stroke="#2c6b55" stroke-width="3"/></svg>`,
  chart:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 36c4-18 20-26 36-22 12 3 16 16 10 26-7 10-24 14-36 10-7-3-11-7-10-14z" fill="#f6efe2" stroke="#7b2d1a" stroke-width="2"/><rect x="20" y="32" width="6" height="12" fill="#7b2d1a"/><rect x="30" y="24" width="6" height="20" fill="#e04e24"/><rect x="40" y="28" width="6" height="16" fill="#7b2d1a"/></svg>`,
  pen:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 32c4-16 20-24 36-20 12 3 16 16 10 26-6 10-24 15-36 10-7-3-11-9-10-16z" fill="#f6c7b4"/><path d="M22 42l3-9 15-15 6 6-15 15z" fill="#7b2d1a"/><path d="M22 42l3-9 6 6z" fill="#fbf7ee"/></svg>`
};
const MANUAL = [
  { label:"LinkedIn", links:[
    ["Brand strategy · Lyon","https://www.linkedin.com/jobs/search/?keywords=brand%20strategy&location=Lyon%2C%20France&f_E=1%2C2"],
    ["Market research · Lyon","https://www.linkedin.com/jobs/search/?keywords=market%20research&location=Lyon%2C%20France&f_E=1%2C2"],
    ["Content strategy · France","https://www.linkedin.com/jobs/search/?keywords=content%20strategy%20english&location=France&f_E=1%2C2"],
    ["Junior marketing · France","https://www.linkedin.com/jobs/search/?keywords=junior%20marketing%20english&location=France&f_E=1%2C2"],
    ["Brand intern · Netherlands","https://www.linkedin.com/jobs/search/?keywords=brand%20intern&location=Netherlands&f_E=1%2C2"],
    ["Marketing intern · Poland","https://www.linkedin.com/jobs/search/?keywords=marketing%20intern%20english&location=Poland&f_E=1%2C2"]
  ]},
  { label:"Indeed", links:[
    ["Brand strategy · Lyon","https://fr.indeed.com/jobs?q=brand+strategy+english&l=Lyon"],
    ["Stage marketing anglais · Lyon","https://fr.indeed.com/jobs?q=stage+marketing+anglais&l=Lyon"],
    ["Market research intern · France","https://fr.indeed.com/jobs?q=market+research+intern&l=France"],
    ["Content intern · France","https://fr.indeed.com/jobs?q=content+intern+english&l=France"],
    ["Brand intern · Netherlands","https://nl.indeed.com/jobs?q=brand+intern+english"],
    ["Marketing intern · Poland","https://pl.indeed.com/jobs?q=marketing+intern+english"]
  ]}
];

/* ---------- state ---------- */
const S = { db:null, roles:[], jobs:[], tracker:{}, meta:null, tab:null,
  f:{place:"all",type:"all",start:"all",extra:"all"}, showHidden:false, loaded:false, offline:false };
try { const t = localStorage.getItem("bs.tab"); if (t) S.tab = t; } catch(e){}
try { const f = JSON.parse(localStorage.getItem("bs.f")||"null"); if (f) Object.assign(S.f, f); } catch(e){}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u||"")) ? String(u) : "";
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("on"),1800); }
const fmtDate = iso => { if(!iso) return ""; const d=new Date(iso+(iso.length===10?"T12:00:00":"")); return isNaN(d)?iso:d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); };

/* ---------- derived ---------- */
const isNew = j => !!(S.meta && S.meta.lastRunAt && j.addedAt && j.addedAt >= S.meta.lastRunAt);
const statusOf = j => (S.tracker[j.id] && S.tracker[j.id].status) || "";
const isHidden = j => ["rejected","skip"].includes(statusOf(j));
function startBucket(s){ // "2027-06" or "flexible"
  if (!s || !/^\d{4}-\d{2}/.test(s)) return "any";
  const [y,m] = s.split("-").map(Number);
  if (y===2027 && m>=6 && m<=8) return "summer27";
  if (y===2027 && m>=9 && m<=11) return "autumn27";
  return "other";
}
function passes(j){
  const f=S.f;
  if (f.place==="lyon" && j.region!=="lyon") return false;
  if (f.place==="france" && j.country!=="France") return false;
  if (f.place==="abroad" && j.country==="France") return false;
  if (f.type!=="all" && j.type!==f.type) return false;
  if (f.start!=="all"){ const b=startBucket(j.start); if (b!==f.start && b!=="any") return false; }
  if (f.extra==="new" && !isNew(j)) return false;
  if (f.extra==="nofr" && j.french==="required") return false;
  return true;
}
const jobsForTab = () => S.jobs.filter(j => j.role===S.tab);

/* ---------- render ---------- */
function renderStatus(){
  const el=$("status");
  if (!S.db && S.loaded){ el.innerHTML="Open this page on claude.ai to see your vacancies"; return; }
  if (!S.loaded){ el.textContent = S.offline ? "Can't reach your data yet. Check your connection." : "loading…"; return; }
  const m=S.meta||{};
  el.innerHTML = m.lastRunAt
    ? `updated <b>${esc(fmtDate(m.lastRunAt))}</b>${m.nextRunAt?` · next update <b>${esc(fmtDate(m.nextRunAt))}</b>`:""}`
    : "waiting for the first update";
}
function renderHeadline(){
  const fresh=S.jobs.filter(isNew), lyon=fresh.filter(j=>j.region==="lyon").length;
  $("headline").textContent = !S.loaded ? "Your internship digest"
    : fresh.length ? `${fresh.length} new ${fresh.length===1?"vacancy":"vacancies"}${lyon?`, ${lyon} in Lyon`:""}`
    : S.jobs.length ? "Nothing new since last time" : "Your internship digest";
}
function renderTabs(){
  const roles=S.roles;
  if (roles.length && S.tab!=="tracker" && !roles.some(r=>r.id===S.tab)) S.tab = roles[0].id;
  if (!roles.length && S.loaded && S.tab!=="tracker") S.tab = "tracker";
  const tracked = Object.values(S.tracker).filter(t=>t.status && !["rejected","skip"].includes(t.status)).length;
  $("tabs").innerHTML = roles.map(r=>{
    const n=S.jobs.filter(j=>j.role===r.id && !isHidden(j)).length;
    return `<button class="tab" role="tab" data-tab="${esc(r.id)}" aria-selected="${S.tab===r.id}">${esc(r.name)}<span class="n">${n}</span></button>`;
  }).join("") + `<button class="tab tracker" role="tab" data-tab="tracker" aria-selected="${S.tab==="tracker"}">My applications<span class="n">${tracked}</span></button>`;
  const r=roles.find(x=>x.id===S.tab);
  $("blurb").textContent = S.tab==="tracker" ? "everything you saved or applied to, across all roles" : (r?.blurb||"");
  $("digestView").hidden = S.tab==="tracker";
  $("trackerView").hidden = S.tab!=="tracker";
}
function renderFilters(){
  $("filters").innerHTML = FILTERS.map(g=>`<div class="fgroup" role="group" aria-label="${g.label}"><span>${g.label}</span>${
    g.opts.map(([v,l])=>`<button class="pill" data-g="${g.key}" data-v="${v}" aria-pressed="${S.f[g.key]===v}">${l}</button>`).join("")}</div>`).join("");
}
function statusSelect(j, id){
  const s=statusOf(j);
  return `<select class="status-select" id="${id}" data-job="${esc(j.id)}" data-s="${s}" aria-label="Application status">${
    STATUSES.map(([v,l])=>`<option value="${v}"${v===s?" selected":""}>${l}</option>`).join("")}</select>`;
}
const frFlag = f => f==="required" ? `<span class="flag fr">French required</span>`
  : f==="nice" ? `<span class="flag">French is a plus</span>` : `<span class="flag en">English only</span>`;
function card(j){
  const m = typeof j.match==="number";
  const plus=(j.plus||[]), minus=(j.minus||[]);
  const url=safeUrl(j.url);
  return `<article class="card${isHidden(j)?" dim":""}">
    ${j.example?`<span class="example">example</span>`:""}
    ${isNew(j)?`<span class="new">new!</span>`:""}
    <div class="ico">${ICONS[j.icon]||ICONS.spark}</div>
    <div class="kicker">${esc(j.city)}${j.country&&j.country!=="France"?`, ${esc(j.country)}`:""} · ${j.type==="junior"?"junior":"internship"}${j.startLabel?` · ${esc(j.startLabel)}`:""}</div>
    <h3>${esc(j.title)}</h3>
    <div class="company">${esc(j.company)}${j.size?` · ${esc(j.size)} people`:""}</div>
    <div class="flags">${frFlag(j.french)}${j.bonus?`<span class="flag bonus">international students ♥</span>`:""}${j.paid===false?`<span class="flag">unpaid</span>`:j.paid===true?`<span class="flag">paid</span>`:""}</div>
    ${m?`<div class="match" title="How well this matches your CV for this role"><span>CV match</span><span class="bar"><i style="width:${Math.max(0,Math.min(100,j.match))}%"></i></span><b>${j.match}%</b></div>`
       :`<div class="match none">CV match appears once your CV is added</div>`}
    ${(plus.length||minus.length)?`<details class="fit"><summary>Strengths & gaps</summary>
      ${plus.length?`<h4>You already have</h4><ul class="plus">${plus.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      ${minus.length?`<h4>They also want</h4><ul class="minus">${minus.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    </details>`:""}
    <div class="actions">${url?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open listing</a>`:""}${statusSelect(j,"st-"+j.id)}</div>
    <div class="src">via ${esc(j.source)}${j.addedAt?` · found ${esc(fmtDate(j.addedAt))}`:""}</div>
  </article>`;
}
function renderCards(){
  const el=$("cards"), btn=$("showHidden");
  if (!S.loaded){ el.innerHTML=`<div class="empty"><p>${S.offline?"can't reach your vacancies yet":"loading your vacancies…"}</p></div>`; btn.hidden=true; return; }
  if (!S.db){ el.innerHTML=`<div class="empty"><p>your vacancies live on claude.ai</p><small>Open this page through its claude.ai link to see them.</small></div>`; btn.hidden=true; return; }
  const all=jobsForTab();
  if (!all.length){ el.innerHTML=`<div class="empty"><p>no vacancies for this role yet</p><small>They will appear after the next update.</small></div>`; btn.hidden=true; return; }
  const hiddenCount = all.filter(isHidden).length;
  const list = all.filter(j=>passes(j) && (S.showHidden || !isHidden(j))).sort((a,b)=>
    (isNew(b)-isNew(a)) || ((b.region==="lyon")-(a.region==="lyon")) || ((b.match??-1)-(a.match??-1)));
  el.innerHTML = list.length ? list.map(card).join("")
    : `<div class="empty"><p>nothing matches these filters</p><small>Try “All” in one of the groups above.</small></div>`;
  btn.hidden = !hiddenCount;
  btn.textContent = S.showHidden ? "Hide rejected and “not for me”" : `Show ${hiddenCount} rejected or “not for me”`;
}
function renderBoard(){
  const byId=Object.fromEntries(S.jobs.map(j=>[j.id,j]));
  $("board").innerHTML = BOARD_COLS.map(([s,label])=>{
    const rows=Object.entries(S.tracker).filter(([id,t])=>t.status===s && byId[id]).map(([id,t])=>{
      const j=byId[id], url=safeUrl(j.url), role=S.roles.find(r=>r.id===j.role);
      return `<div class="trow"><b>${esc(j.title)}</b>
        <span class="meta">${esc(j.company)} · ${esc(j.city)}${role?` · ${esc(role.name)}`:""}</span>
        <input id="note-${esc(id)}" data-note="${esc(id)}" value="${esc(t.note||"")}" placeholder="Note: contact, deadline, next step…" aria-label="Note">
        <div class="row">${statusSelect(j,"bs-"+id)}${url?`<a href="${esc(url)}" target="_blank" rel="noopener">listing ↗</a>`:""}</div></div>`;
    });
    return `<section class="col"><h3>${label}<span>${rows.length}</span></h3>${rows.join("")||`<p class="none">Nothing here yet.</p>`}</section>`;
  }).join("");
}
function renderManual(){
  $("mgrid").innerHTML = MANUAL.map(q=>`<div class="mbox"><h4>${q.label}</h4>${q.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join("")}</div>`).join("");
}
function render(){ renderStatus(); renderHeadline(); renderTabs(); if (S.tab==="tracker") renderBoard(); else renderCards(); }

/* ---------- events ---------- */
$("tabs").addEventListener("click", e=>{
  const b=e.target.closest(".tab"); if(!b) return;
  S.tab=b.dataset.tab; try{localStorage.setItem("bs.tab",S.tab)}catch(e){}
  render();
});
$("filters").addEventListener("click", e=>{
  const b=e.target.closest(".pill"); if(!b) return;
  S.f[b.dataset.g]=b.dataset.v; try{localStorage.setItem("bs.f",JSON.stringify(S.f))}catch(e){}
  renderFilters(); renderCards();
});
$("showHidden").addEventListener("click", ()=>{ S.showHidden=!S.showHidden; renderCards(); });

const writing = new Set();
async function saveTracker(id, patch){
  if (!S.db){ toast("Open on claude.ai to save"); return; }
  if (writing.has(id)) { await new Promise(r=>setTimeout(r,300)); return saveTracker(id, patch); }
  writing.add(id);
  const prev=S.tracker[id]||{};
  const next={...prev, ...patch, updatedAt:new Date().toISOString()};
  try { await S.db.doc("tracker/"+id).set(next); toast(patch.status!==undefined ? (patch.status ? "Status saved" : "Removed from tracker") : "Note saved"); }
  catch(err){ toast(err&&err.code==="quota_exceeded" ? "Storage is full" : "Couldn't save. Try again."); }
  finally { writing.delete(id); }
}
document.addEventListener("change", e=>{
  const s=e.target.closest(".status-select");
  if (s) { s.dataset.s=s.value; saveTracker(s.dataset.job,{status:s.value}); }
});
document.addEventListener("focusout", e=>{
  const i=e.target.closest("input[data-note]"); if(!i) return;
  const id=i.dataset.note; if ((S.tracker[id]?.note||"")===i.value) return;
  saveTracker(id,{note:i.value});
});

/* ---------- data ---------- */
renderFilters(); renderManual(); render();
(async ()=>{
  const db = window.claude ? await window.claude.use("db").catch(()=>null) : null;
  if (!db){ S.loaded=true; render(); return; }
  S.db=db;
  const got={roles:false,jobs:false,tracker:false,meta:false};
  const timer=setTimeout(()=>{ if(!S.loaded){ S.offline=true; render(); } },10000);
  const mark=(k,snap)=>{ if(!snap.metadata.fromCache) got[k]=true;
    if (Object.values(got).every(Boolean)){ S.loaded=true; S.offline=false; clearTimeout(timer); } };
  const fail=k=>()=>{ got[k]=true; if(Object.values(got).every(Boolean)){S.loaded=true;clearTimeout(timer);} render(); };
  db.collection("roles").orderBy("order").onSnapshot(snap=>{
    S.roles=snap.docs.map(d=>({id:d.id,...d.data()})); mark("roles",snap); render();
  }, fail("roles"));
  db.collection("jobs").onSnapshot(snap=>{
    S.jobs=snap.docs.map(d=>({id:d.id,...d.data()})); mark("jobs",snap); render();
  }, fail("jobs"));
  db.collection("tracker").onSnapshot(snap=>{
    S.tracker=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()])); mark("tracker",snap);
    // keep a note field the user is typing in
    if (document.activeElement && document.activeElement.matches("input[data-note]")) { renderTabs(); return; }
    render();
  }, fail("tracker"));
  db.doc("meta/digest").onSnapshot(snap=>{
    S.meta=snap.exists?snap.data():null; mark("meta",snap); render();
  }, fail("meta"));
})();
})();
</script>
